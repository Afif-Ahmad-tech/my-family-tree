<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Chart Demo for MR</title>
  <script src="https://unpkg.com/d3@7"></script>
  <link rel="stylesheet" href="dist/styles/family-chart.css">
  <script type="module" src="dist/family-chart.esm.js"></script>
</head>
<body>
<div id="FamilyChart" class="f3" style="width:100%;height:900px;margin:auto;background-color:rgb(33,33,33);color:#fff;"></div>
<script type="module">
  import * as f3 from './dist/family-chart.esm.js';

  const data = [
    {
      "id": "1",
      "data": {"first name": "John", "last name": "Doe", "birthday": "1980", "gender": "M", "brother": [], "sister": []},
      "rels": {"spouses": ["2"], "children": ["3"]}
    },
    {
      "id": "2",
      "data": {"first name": "Jane", "last name": "Doe", "birthday": "1982", "gender": "F", "brother": [], "sister": []},
      "rels": {"spouses": ["1"], "children": ["3"]}
    },
    {
      "id": "3",
      "data": {"first name": "Bob", "last name": "Doe", "birthday": "2005", "gender": "M", "brother": [], "sister": []},
      "rels": {"parents": ["1", "2"]}
    }
  ];

  const f3Chart = f3.createChart('#FamilyChart', data);
  f3Chart.setCardHtml()
         .setCardDisplay([["first name","last name"],["birthday"],["brother","sister"]]);
  f3Chart.updateTree({initial:true});
</script>
</body>
</html>
